<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Amet — privates Finance Command Center. Konto, Handyhülle-Bargeld und Reserve beim Bruder im Blick, mit KI-Kurzeinschätzung.">
<title>Amet — Private Finance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a0b0d' stroke='%23c8a24d' stroke-width='3'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='32' font-weight='bold' fill='%23c8a24d' text-anchor='middle'%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>AMET</h1>
            <p class="tagline">Private Finance</p>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">E-Mail</label>
                    <input type="email" id="loginEmail" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Passwort</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                </div>
                <p id="loginError" class="field-error" role="alert"></p>
                <div class="form-actions">
                    <button type="submit" class="addBtn">Anmelden</button>
                </div>
            </form>
        </div>
    </div>

    <div id="appRoot" hidden>
        <div id="app">
            <div class="app-header-row">
                <div>
                    <h1>AMET</h1>
                    <p class="tagline">Private Finance</p>
                </div>
                <button id="logoutBtn" class="cancelBtn">Abmelden</button>
            </div>

            <nav class="app-nav">
                <button type="button" data-view="dashboard" class="active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span class="nav-text">Dashboard</span>
                </button>
                <button type="button" data-view="transactions">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h13l-3-3"/><path d="M20 17H7l3 3"/></svg>
                    <span class="nav-text">Transactions</span>
                </button>
                <button type="button" data-view="analytics">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
                    <span class="nav-text">Analytics</span>
                </button>
                <button type="button" data-view="goals">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.7" fill="currentColor" stroke="none"/></svg>
                    <span class="nav-text">Goals</span>
                </button>
                <button type="button" data-view="ai">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c0 4-2.5 6.5-6.5 6.5 4 0 6.5 2.5 6.5 6.5 0-4 2.5-6.5 6.5-6.5-4 0-6.5-2.5-6.5-6.5Z"/></svg>
                    <span class="nav-text">AI</span>
                </button>
                <button type="button" data-view="settings">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.97 7.97 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a8 8 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a8 8 0 0 0-1.7 1l-2.5-1-2 3.4L6.4 11a7.97 7.97 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a8 8 0 0 0 1.7 1L11 21h4l.4-2.9a8 8 0 0 0 1.7-1l2.5 1 2-3.4L19.4 13Z"/></svg>
                    <span class="nav-text">Settings</span>
                </button>
            </nav>

            <section class="view-section" data-view="dashboard">
                <div id="dashboardContainer"></div>
            </section>

            <section class="view-section" data-view="transactions" hidden>
                <div id="summaryContainer"></div>
                <div id="formContainer"></div>
                <h2>Transaktionen</h2>
                <div class="list-filters">
                    <input type="search" id="transactionSearch" placeholder="Suche nach Kategorie, Wallet oder Notiz…">
                    <select id="transactionTypeFilter">
                        <option value="all">Alle Typen</option>
                        <option value="income">Nur Einnahmen</option>
                        <option value="expense">Nur Ausgaben</option>
                        <option value="transfer">Nur Transfers</option>
                    </select>
                </div>
                <div id="transactionsContainer">
                    <p class="empty-hint">Noch keine Transaktionen vorhanden. Füge eine hinzu!</p>
                </div>
            </section>

            <section class="view-section" data-view="analytics" hidden>
                <h2>Vermögensentwicklung</h2>
                <div id="netWorthChartContainer" class="chart-card">
                    <div class="chart-wrap"><canvas id="netWorthChart"></canvas></div>
                </div>

                <h2>Income vs Expenses</h2>
                <div class="chart-card">
                    <div class="chart-wrap"><canvas id="incomeExpenseChart"></canvas></div>
                </div>

                <h2>Kategorien</h2>
                <div id="reportsContainer">
                    <div id="expensePieChartContainer">
                        <h3>Ausgaben nach Kategorie</h3>
                        <div class="chart-wrap"><canvas id="expensePieChart"></canvas></div>
                    </div>
                    <div id="incomeBarChartContainer">
                        <h3>Einnahmen nach Kategorie</h3>
                        <div class="chart-wrap"><canvas id="incomeBarChart"></canvas></div>
                    </div>
                </div>

                <div id="taxReportContainer">
                    <h2>Ausgabenbericht</h2>
                    <div id="taxReportContent"></div>
                </div>

                <h2>Forecast</h2>
                <div id="forecastContainer" class="chart-card"></div>
            </section>

            <section class="view-section" data-view="goals" hidden>
                <h2>Sparziele</h2>
                <div id="goalAddRow" class="goal-add-row"></div>
                <div id="goalsContainer" class="goal-grid"></div>

                <h2>Budgets (dieser Monat)</h2>
                <div id="budgetAddRow" class="budget-add-row"></div>
                <div id="budgetsContainer" class="budget-grid"></div>
            </section>

            <section class="view-section" data-view="ai" hidden>
                <div id="aiContainer"></div>
            </section>

            <section class="view-section" data-view="settings" hidden>
                <div id="settingsContainer"></div>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
